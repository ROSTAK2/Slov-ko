name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build course.json
        run: python3 tools/build_course.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project Slovicko.xcodeproj -target Slovicko -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Slovicko.app Payload/
          zip -qry Slovicko.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Slovicko-ipa
          path: Slovicko.ipa

      - name: Publish release (direct link for iPhone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Slovíčko build ${{ github.run_number }}
          files: Slovicko.ipa
